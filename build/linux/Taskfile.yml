version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  build:
    summary: Builds the Linux binary (GTK4 + WebKitGTK 6.0)
    deps:
      - task: common:build:frontend
        vars:
          DEV: '{{.DEV}}'
    cmds:
      - mkdir -p "{{.BIN_DIR}}"
      - go build {{.BUILD_FLAGS}} -o "{{.OUTPUT}}"
    vars:
      VERSION_LDFLAG: '{{if .VERSION}} -X thaw/internal/version.Version={{.VERSION}}{{end}}'
      BUILD_FLAGS: '{{if eq .DEV "true"}}-tags dev{{if .EXTRA_TAGS}},{{.EXTRA_TAGS}}{{end}} -buildvcs=false -gcflags=all="-l"{{else}}-tags production{{if .EXTRA_TAGS}},{{.EXTRA_TAGS}}{{end}} -trimpath -buildvcs=false -ldflags="-w -s{{.VERSION_LDFLAG}}"{{end}}'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{.OUTPUT | default .DEFAULT_OUTPUT}}'
    env:
      GOOS: linux
      CGO_ENABLED: "1"
      GOARCH: '{{.ARCH | default ARCH}}'

  package:
    summary: Builds the production Linux binary
    cmds:
      - task: build
        vars:
          ARCH: '{{.ARCH}}'
          DEV: '{{.DEV}}'
          VERSION: '{{.VERSION}}'
          EXTRA_TAGS: '{{.EXTRA_TAGS}}'

  run:
    summary: Launches the built Linux binary
    cmds:
      - '"{{.BIN_DIR}}/{{.APP_NAME}}"'
