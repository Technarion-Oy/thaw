version: '3'

tasks:
  install:frontend:deps:
    summary: Installs frontend npm dependencies
    run: once
    dir: frontend
    sources:
      - package.json
      - package-lock.json
    generates:
      - node_modules
    preconditions:
      - sh: npm version
        msg: "npm is required to build Thaw's frontend."
    cmds:
      - '{{if eq (env "CI") "true"}}npm ci{{else}}npm install{{end}}'

  generate:bindings:
    summary: Generates TypeScript interface bindings into frontend/bindings/
    run: once
    cmds:
      - wails3 generate bindings -ts -i -clean=true

  build:frontend:
    summary: Builds the React/TypeScript frontend bundle into frontend/dist/
    run: once
    dir: frontend
    deps:
      - task: install:frontend:deps
    cmds:
      - npm run {{if eq .DEV "true"}}build:dev{{else}}build{{end}}
    env:
      PRODUCTION: '{{if eq .DEV "true"}}false{{else}}true{{end}}'

  generate:icons:
    summary: Generates macOS .icns and Windows .ico icons from build/appicon.png
    run: once
    dir: build
    sources:
      - appicon.png
    generates:
      - darwin/icons.icns
      - windows/icon.ico
    cmds:
      - wails3 generate icons -input appicon.png -macfilename darwin/icons.icns -windowsfilename windows/icon.ico

  dev:frontend:
    summary: Runs the Vite development server
    deps:
      - task: install:frontend:deps
    dir: frontend
    cmds:
      - npm run dev -- --port {{.VITE_PORT}} --strictPort
