version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  generate:assets:
    summary: Generates Windows info.json, manifest, and NSIS wails_tools.nsh from build/config.yml
    internal: true
    cmds:
      - cmd: |
          powershell -NoProfile -Command '
            $ErrorActionPreference = "Stop"
            $tmp = "build\windows\.assets-tmp"
            if (Test-Path $tmp) { Remove-Item -Recurse -Force $tmp }
            $wailsArgs = @("update", "build-assets", "-name", "{{.APP_NAME}}", "-binaryname", "{{.APP_NAME}}", "-config", "build\config.yml", "-dir", $tmp, "-silent")
            if ("{{.VERSION}}" -match "^[0-9]+\.[0-9]+\.[0-9]+$") {
              $wailsArgs += @("-productversion", "{{.VERSION}}")
            }
            & wails3 @wailsArgs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Copy-Item -Force "$tmp\windows\info.json" "build\windows\info.json"
            Copy-Item -Force "$tmp\windows\wails.exe.manifest" "build\windows\wails.exe.manifest"
            Copy-Item -Force "$tmp\windows\nsis\wails_tools.nsh" "build\windows\installer\wails_tools.nsh"
            Remove-Item -Recurse -Force $tmp
          '
        platforms: [windows]
      - cmd: |
          rm -rf build/windows/.assets-tmp
          VERSION_FLAG=""
          if [ -n "{{.VERSION}}" ] && echo "{{.VERSION}}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            VERSION_FLAG="-productversion {{.VERSION}}"
          fi
          wails3 update build-assets -name "{{.APP_NAME}}" -binaryname "{{.APP_NAME}}" -config build/config.yml -dir build/windows/.assets-tmp $VERSION_FLAG -silent
          cp build/windows/.assets-tmp/windows/info.json build/windows/info.json
          cp build/windows/.assets-tmp/windows/wails.exe.manifest build/windows/wails.exe.manifest
          cp build/windows/.assets-tmp/windows/nsis/wails_tools.nsh build/windows/installer/wails_tools.nsh
          rm -rf build/windows/.assets-tmp
        platforms: [linux, darwin]

  generate:syso:
    summary: Generates Windows resource .syso file for the target architecture
    deps:
      - task: common:generate:icons
      - task: generate:assets
        vars:
          VERSION: '{{.VERSION}}'
    dir: build
    cmds:
      - wails3 generate syso -arch {{.ARCH}} -icon windows/icon.ico -manifest windows/wails.exe.manifest -info windows/info.json -out ../wails_windows_{{.ARCH}}.syso
    vars:
      ARCH: '{{.ARCH | default ARCH}}'

  cleanup:syso:
    summary: Removes generated Windows .syso files from the repo root
    internal: true
    cmds:
      - cmd: powershell -NoProfile -Command 'Remove-Item -Force -ErrorAction SilentlyContinue wails_windows_*.syso'
        platforms: [windows]
      - cmd: rm -f wails_windows_*.syso
        platforms: [linux, darwin]

  build:
    summary: Builds the Windows executable (build/bin/thaw.exe)
    deps:
      - task: common:build:frontend
        vars:
          DEV: '{{.DEV}}'
      - task: generate:syso
        vars:
          ARCH: '{{.ARCH}}'
          VERSION: '{{.VERSION}}'
    cmds:
      - defer: { task: cleanup:syso }
      - cmd: powershell -NoProfile -Command 'New-Item -ItemType Directory -Force -Path "{{.BIN_DIR}}" | Out-Null'
        platforms: [windows]
      - cmd: mkdir -p "{{.BIN_DIR}}"
        platforms: [linux, darwin]
      - go build {{.BUILD_FLAGS}} -o "{{.BIN_DIR}}/{{.APP_NAME}}.exe"
    vars:
      VERSION_LDFLAG: '{{if .VERSION}} -X thaw/internal/version.Version={{.VERSION}}{{end}}'
      BUILD_FLAGS: '{{if eq .DEV "true"}}{{if .EXTRA_TAGS}}-tags {{.EXTRA_TAGS}} {{end}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production{{if .EXTRA_TAGS}},{{.EXTRA_TAGS}}{{end}} -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui{{.VERSION_LDFLAG}}"{{end}}'
    env:
      GOOS: windows
      CGO_ENABLED: '{{.CGO_ENABLED | default "0"}}'
      GOARCH: '{{.ARCH | default ARCH}}'

  create:nsis:installer:
    summary: Packages an existing build/bin/thaw.exe into the per-user NSIS installer
    deps:
      - task: common:generate:icons
      - task: generate:assets
        vars:
          VERSION: '{{.VERSION}}'
    dir: build/windows/installer
    cmds:
      - wails3 generate webview2bootstrapper -dir "{{.ROOT_DIR}}/build/windows/installer"
      - |
        {{if eq OS "windows"}}
        makensis -DARG_WAILS_{{.ARG_FLAG}}_BINARY="{{.ROOT_DIR}}\{{.BIN_DIR | replace "/" "\\"}}\{{.APP_NAME}}.exe" project.nsi
        {{else}}
        makensis -DARG_WAILS_{{.ARG_FLAG}}_BINARY="{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}.exe" project.nsi
        {{end}}
    vars:
      ARCH: '{{.ARCH | default ARCH}}'
      ARG_FLAG: '{{if eq .ARCH "arm64"}}ARM64{{else}}AMD64{{end}}'

  package:
    summary: Builds thaw.exe and packages the NSIS installer
    cmds:
      - task: build
        vars:
          ARCH: '{{.ARCH}}'
          DEV: '{{.DEV}}'
          VERSION: '{{.VERSION}}'
          EXTRA_TAGS: '{{.EXTRA_TAGS}}'
      - task: create:nsis:installer
        vars:
          ARCH: '{{.ARCH}}'
          VERSION: '{{.VERSION}}'

  run:
    summary: Launches the built Windows executable
    cmds:
      - '"{{.BIN_DIR}}/{{.APP_NAME}}.exe"'
