name: dbt Integration Test

# Least-privilege default: read-only token unless a job opts into more.
permissions:
  contents: read

on:
  schedule:
    - cron: "0 3 * * 1"  # Every Monday at 03:00 UTC
  workflow_dispatch:

env:
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  dbt-roundtrip:
    name: dbt project round-trip
    runs-on: self-hosted
    container: ubuntu:26.04@sha256:c098726dd9b9733f3e885f8de0ef375206a311b0a317eadc40d347b1115fb944
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Install base tools
        run: |
          apt-get update
          apt-get install -y git curl wget

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Download Go dependencies
        run: go mod download

      # Python 3.12 is used to match the dbt-snowflake supported range.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14.7"

      # Install the dbt Snowflake adapter.  dbt-core is pulled in as a
      # transitive dependency.  Pin to the 1.x generation which supports
      # the profiles.yml private_key_path field used by the test.
      - name: Install dbt-snowflake
        run: pip install "dbt-snowflake>=1.8,<2"

      - name: Install go-junit-report
        run: go install github.com/jstemmer/go-junit-report/v2@latest

      # The test creates two temporary Snowflake databases (THAW_DBT_SRC_<rand>
      # and THAW_DBT_TGT_<rand>), generates a dbt project from the source,
      # deploys it via `dbt run`, verifies row counts and column shapes, then
      # drops both databases even on failure.
      #
      # The test skips gracefully when SNOWFLAKE_PRIVATE_KEY is not set,
      # so this job is safe to run on forks that lack the secrets.
      - name: Run dbt round-trip integration test
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
        run: >
          go test -v -tags integration -count=1 -timeout 15m
          -run TestDbtProjectRoundTrip
          ./internal/integration/...
          2>&1 | go-junit-report -set-exit-code > report-dbt.xml

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d # v2
        if: always()
        # Best-effort reporting; the go test step already fails the job on real
        # failures. Don't let a flaky GitHub API throttle (429) fail the build.
        continue-on-error: true
        with:
          files: report-dbt.xml
          check_name: dbt round-trip test
          compare_to_earlier_commit: false
      
      - name: Unlock permissions for host runner agent
        if: always() 
        run: chmod -R 777 $GITHUB_WORKSPACE/../../_actions || true
