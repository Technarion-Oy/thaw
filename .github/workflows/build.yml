name: Build Binaries

# Least-privilege default: read-only token unless a job opts into more.
permissions:
  contents: read

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build — ${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest   # arm64 (M-series runner)
            platform: darwin
            arch: arm64
          - os: macos-15-large  # Intel (x86_64) runner
            platform: darwin
            arch: amd64
          - os: windows-latest
            platform: windows
            arch: amd64
          - os: windows-latest # cross-compile arm64 on amd64 runner
            platform: windows
            arch: arm64
          - os: ubuntu-24.04   # pinned: ships libgtk-4-dev + libwebkitgtk-6.0-dev
            platform: linux
            arch: amd64

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libx11-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: Download Go dependencies
        run: go mod download

      - name: Install NSIS (Windows only)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          choco install nsis
          # Explicitly add NSIS to the GitHub runner's PATH for subsequent steps
          echo "C:\Program Files (x86)\NSIS" >> $GITHUB_PATH

      - name: Prepare version string
        id: prep
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            # Strip the leading "v" from semantic version tags (v1.2.3 → 1.2.3)
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            # Replace / with - in branch names to avoid path issues in filenames
            VERSION=$(echo "${{ github.ref_name }}" | sed 's/\//-/g')
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      # ── Wails Builds ──────────────────────────────────────────────────────
      # No -obfuscated/garble: the source is public, so binary obfuscation buys
      #   nothing — and it broke once Go toolchain downloads moved under
      #   GOMODCACHE (garble's linker overlay is rejected there). Windows had
      #   already dropped it (issue #820, Defender/SmartScreen heuristics).
      # Platform Taskfiles handle -trimpath, version ldflags, icons, .app bundle
      # (macOS), and .syso + wails_tools.nsh (Windows).

      - name: Build & Package (macOS)
        if: matrix.platform == 'darwin'
        run: wails3 task darwin:package ARCH=${{ matrix.arch }} VERSION=${{ steps.prep.outputs.version }}
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Build (Linux)
        if: matrix.platform == 'linux'
        run: wails3 task linux:build ARCH=${{ matrix.arch }} VERSION=${{ steps.prep.outputs.version }}
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Build binary (Windows)
        if: matrix.platform == 'windows'
        # Compiles build/bin/thaw.exe with embedded .syso resources and generates
        # build/windows/installer/wails_tools.nsh. The NSIS installer is packaged
        # AFTER Azure Trusted Signing signs thaw.exe (issue #820).
        run: wails3 task windows:build ARCH=${{ matrix.arch }} VERSION=${{ steps.prep.outputs.version }}
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      # ── Sign Windows binaries (Azure Trusted Signing) ───────────────────────
      # Correct signing order (issue #820): sign the app binary FIRST, then
      # package it into the NSIS installer, then sign the installer. Previously a
      # single sign step ran after packaging, so the thaw.exe embedded inside the
      # installer was never signed.
      - name: Azure Login (Windows only)
        if: matrix.platform == 'windows'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'
          allow-no-subscriptions: true

      - name: Sign app binary (Windows)
        if: matrix.platform == 'windows'
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_CODE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_CERTIFICATE_PROFILE_NAME }}
          files: ${{ github.workspace }}/build/bin/thaw.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Package installer with the signed binary (Windows)
        if: matrix.platform == 'windows'
        # Packages the freshly signed build/bin/thaw.exe into
        # build/bin/thaw-<arch>-installer.exe via build/windows/installer/project.nsi
        # without rebuilding thaw.exe.
        run: wails3 task windows:create:nsis:installer ARCH=${{ matrix.arch }} VERSION=${{ steps.prep.outputs.version }}

      - name: Sign installer (Windows)
        if: matrix.platform == 'windows'
        uses: azure/trusted-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_CODE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_CERTIFICATE_PROFILE_NAME }}
          files: ${{ github.workspace }}/build/bin/thaw-${{ matrix.arch }}-installer.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # ── Rename / package output with tag version ───────────────────────────
      - name: Package macOS app bundle
        if: matrix.platform == 'darwin'
        run: |
          cd build/bin
          ditto -c -k --keepParent thaw.app "thaw-${{ steps.prep.outputs.version }}-darwin-${{ matrix.arch }}.zip"

      - name: Rename Windows binaries
        if: matrix.platform == 'windows'
        shell: pwsh
        # Wails natively outputted both the raw executable and the installer, we rename both
        run: |
          Move-Item build/bin/thaw.exe "build/bin/thaw-${{ steps.prep.outputs.version }}-windows-${{ matrix.arch }}-portable.exe"
          Move-Item "build/bin/thaw-${{ matrix.arch }}-installer.exe" "build/bin/thaw-${{ steps.prep.outputs.version }}-windows-${{ matrix.arch }}-installer.exe"

      - name: Rename Linux binary
        if: matrix.platform == 'linux'
        run: mv build/bin/thaw "build/bin/thaw-${{ steps.prep.outputs.version }}-linux-amd64"

      # ── Linux binary verification (checksums + GPG signing) ───────────────

      - name: Generate checksums (Linux)
        if: matrix.platform == 'linux'
        run: cd build/bin && sha256sum thaw-*-linux-amd64 > checksums.txt

      - name: Import GPG key (Linux)
        if: matrix.platform == 'linux'
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Sign checksums (Linux)
        if: matrix.platform == 'linux'
        run: cd build/bin && gpg --detach-sign --armor --local-user releases@technarion.com --output checksums.txt.sig checksums.txt

      # ── Store artifact (non-tag runs) ──────────────────────────────────────
      # On tag runs binaries are attached directly to the GitHub Release below.
      - name: Upload artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: thaw-${{ steps.prep.outputs.version }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            build/bin/thaw-${{ steps.prep.outputs.version }}-*
            build/bin/checksums.txt
            build/bin/checksums.txt.sig
          retention-days: 30
          if-no-files-found: error

      # ── Attach binaries to GitHub Release (tag runs only) ──────────────────
      # The release itself (notes + tag) is created by manual-release.yml via
      # semantic-release.  This step appends the platform binary to it.
      - name: Upload binaries to GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: ${{ github.ref_name }}
          append_body: false
          fail_on_unmatched_files: true
          files: build/bin/thaw-${{ steps.prep.outputs.version }}-*

      - name: Upload checksums to GitHub Release (Linux)
        if: github.ref_type == 'tag' && matrix.platform == 'linux'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: ${{ github.ref_name }}
          append_body: false
          fail_on_unmatched_files: true
          files: |
            build/bin/checksums.txt
            build/bin/checksums.txt.sig

      # ── Post-release checklist reminder (issue #820) ───────────────────────
      # SmartScreen scores download reputation per file hash, so every new
      # installer starts from zero. Submitting each release installer to
      # Microsoft for review usually clears the "isn't commonly downloaded"
      # warning within days. Only meaningful on tag runs, where the installer is
      # actually attached to the GitHub Release above.
      - name: SmartScreen submission reminder (Windows)
        if: github.ref_type == 'tag' && matrix.platform == 'windows'
        shell: bash
        run: |
          {
            echo "### 🪟 Post-release: submit the Windows installer to Microsoft (issue #820)"
            echo ""
            echo "Every release produces a new file hash, so SmartScreen download reputation resets each version."
            echo "To clear the \"isn't commonly downloaded\" warning faster:"
            echo ""
            echo "1. Download \`thaw-${{ steps.prep.outputs.version }}-windows-${{ matrix.arch }}-installer.exe\` from the release."
            echo "2. Submit it at <https://www.microsoft.com/en-us/wdsi/filesubmission> → **Software developer** → report as incorrectly detected."
            echo "3. Publisher reputation under Azure Trusted Signing keeps accruing across releases, so this should stop being needed over time."
          } >> "$GITHUB_STEP_SUMMARY"
